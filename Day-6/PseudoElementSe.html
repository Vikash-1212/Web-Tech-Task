<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suedo Element selectors</title>
    <style>
        h1::after{
            content: " wedding";
        }
        h1::before{
            content: "Veera";
        }
        h1::first-letter{
            color: red;
        }
        h1::first-line{
            background-color: blanchedalmond;
        }

        li::marker{
            content:"->";
        }
        li::selection{
            color:  red;
            background-color: yellow;
        }

    </style>
</head>
<body>
<h1>Di</h1>

<ol>
    <li>list 1</li>
    <li>list 2</li>
    <li>list 3</li>
    <li>list 4</li>
    <li>list 5</li>
</ol>
    
</body>
</html>
