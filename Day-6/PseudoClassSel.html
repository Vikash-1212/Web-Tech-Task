    <title>Pseeudo Class Selectors</title>
    <style>
        a:link{
            color: red;
        }
        a:visited{
            color: aqua;
        }
        a:hover{
            cursor: poiter;
        }
        a:active{
            color: beige;
        }

        h1:first-child{
            color: red;
        }
         h1:last-child{
            color: blanchedalmond;
        }
         h1:nth-child(4){
            color: blueviolet;
        }
        h1:first-of-type{
            color: aquamarine;
        }
        h1:last-of-type{
            color: burlywood;
        }

    </style>
</head>
